name: Desktop

on:
  pull_request:
  push:
    branches: [master, test/isolated-sdk, test/desktop-ci-regressions]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 16.20.2
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: node .yarn/releases/yarn-3.2.0.cjs install --immutable --mode=skip-build
      - name: Install Electron
        run: node node_modules/electron/install.js
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libfuse2t64
      - name: Setup, sync progress and updater regressions
        run: node build/runDesktopTests.js
      - name: Renderer and saved-state regressions (Windows)
        if: runner.os == 'Windows'
        run: node build/testRenderer.js
      - name: Renderer and saved-state regressions (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node build/testRenderer.js
      - name: Fetch and verify the pinned SDK candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build/fetchSdkCandidate.js
      - name: SDK isolation, production compilation and packaging
        run: node build/buildDesktop.js
      - name: Verify packaged SDK and update metadata
        run: node build/testDesktopPackage.js
      - name: Packaged application startup and shutdown (Windows)
        if: runner.os == 'Windows'
        run: node build/testPackagedDesktop.js
      - name: Packaged application startup and shutdown (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node build/testPackagedDesktop.js
      - name: Confirm the build preserved source and lockfile
        run: git diff --exit-code
      - name: Keep package verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-evidence-${{ runner.os }}
          path: |
            dist/ci/
            dist/package-tests/*-desktop.log
            dist/isolation-tests/*/logs/daemon-console.log
          if-no-files-found: warn
          retention-days: 14
      - name: Keep test packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/ng/*.exe
            dist/ng/*.blockmap
            dist/ng/latest.yml
            dist/ng-linux/*.AppImage
            dist/ng-linux/*.tar.gz
            dist/ng-linux/latest-linux.yml
            build/sdk-candidate.json
          if-no-files-found: error
          retention-days: 14
